<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="菌菌">
  <title>菌菌 — computer science.</title>
  <defs>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0090ff"/>
      <stop offset="52%" stop-color="#7d7aff"/>
      <stop offset="100%" stop-color="#ff6482"/>
    </linearGradient>
    <radialGradient id="blobBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cfe4ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#cfe4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobPink" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd9e8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd9e8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="880" height="280" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="280" fill="#fbfbfd"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 24 -12; 0 0" keyTimes="0; 0.5; 1" dur="26s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <ellipse cx="170" cy="36" rx="320" ry="170" fill="url(#blobBlue)"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; -22 10; 0 0" keyTimes="0; 0.5; 1" dur="30s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
      <ellipse cx="730" cy="252" rx="340" ry="180" fill="url(#blobPink)"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', sans-serif" text-anchor="middle">
      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.05s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.28 0.11 0.32 1"/>
        <text x="442" y="62" font-size="12" letter-spacing="4" fill="#86868b">SSC8327</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="1s" begin="0.2s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.28 0.11 0.32 1"/>
        <animateTransform attributeName="transform" type="translate" values="0 18; 0 0" keyTimes="0; 1" dur="1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.28 0.11 0.32 1"/>
        <text x="441" y="128" font-size="62" font-weight="600" letter-spacing="2" fill="#1d1d1f">菌菌</text>
      </g>

      <rect x="440" y="148" width="0" height="3" rx="1.5" fill="url(#accent)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.62s" fill="freeze"/>
        <animate attributeName="x" values="440; 350" keyTimes="0; 1" dur="1.1s" begin="0.62s" fill="freeze" calcMode="spline" keySplines="0.28 0.11 0.32 1"/>
        <animate attributeName="width" values="0; 180" keyTimes="0; 1" dur="1.1s" begin="0.62s" fill="freeze" calcMode="spline" keySplines="0.28 0.11 0.32 1"/>
      </rect>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.48s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.28 0.11 0.32 1"/>
        <animateTransform attributeName="transform" type="translate" values="0 14; 0 0" keyTimes="0; 1" dur="0.9s" begin="0.48s" fill="freeze" calcMode="spline" keySplines="0.28 0.11 0.32 1"/>
        <text x="440" y="192" font-size="20" fill="#6e6e73">computer science.</text>
      </g>

      <g opacity="0">
        <animate attributeName="opacity" from="0" to="1" dur="0.9s" begin="0.74s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.28 0.11 0.32 1"/>
        <animateTransform attributeName="transform" type="translate" values="0 12; 0 0" keyTimes="0; 1" dur="0.9s" begin="0.74s" fill="freeze" calcMode="spline" keySplines="0.28 0.11 0.32 1"/>
        <text x="440" y="226" font-size="15" fill="#86868b">深度学习与计算机视觉 · 软件测试 · Linux 与自托管</text>
      </g>
    </g>
  </g>
</svg>
